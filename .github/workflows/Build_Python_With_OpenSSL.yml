
name: Build Python with OpenSSL on macOS ARM64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ==========================================
# Global versions - edit here only
# ==========================================
env:
  PYTHON_VERSION: "3.15.2"
  OPENSSL_VERSION: "4.1.0"

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ARM64 Packages
    runs-on: macos-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Initialize environment
      # ==========================================
      - name: Initialize build paths
        run: |
          set -euo pipefail

          ARCH="$(uname -m)"

          echo "Architecture: ${ARCH}"
          echo "macOS: $(sw_vers -productVersion)"

          if [ "${ARCH}" != "arm64" ]; then
            echo "::error::ARM64 runner required"
            exit 1
          fi

          OPENSSL_TARGET="/usr/local/openssl-${OPENSSL_VERSION}"
          PYTHON_TARGET="/usr/local/Python-${PYTHON_VERSION}"
          PYTHON_MINOR="${PYTHON_VERSION%.*}"

          {
            echo "OPENSSL_TARGET=${OPENSSL_TARGET}"
            echo "PYTHON_TARGET=${PYTHON_TARGET}"
            echo "PYTHON_MINOR=${PYTHON_MINOR}"
          } >> "$GITHUB_ENV"

          echo "OpenSSL: ${OPENSSL_VERSION}"
          echo "Python: ${PYTHON_VERSION}"
          echo "OpenSSL path: ${OPENSSL_TARGET}"
          echo "Python path: ${PYTHON_TARGET}"

      # ==========================================
      # 3. Download OpenSSL
      # ==========================================
      - name: Download OpenSSL
        run: |
          set -euo pipefail

          URL="https://openssl-library.org/source/openssl-${OPENSSL_VERSION}.tar.gz"

          curl --fail --location \
            --retry 3 \
            --connect-timeout 30 \
            --output openssl.tar.gz \
            "$URL"

          tar -xzf openssl.tar.gz

          mv "openssl-${OPENSSL_VERSION}" openssl_src

          test -f openssl_src/Configure

      # ==========================================
      # 4. Build OpenSSL
      # ==========================================
      - name: Build and install OpenSSL
        run: |
          set -euo pipefail

          cd openssl_src

          ./Configure \
            darwin64-arm64-cc \
            shared \
            --prefix="${OPENSSL_TARGET}" \
            --openssldir="${OPENSSL_TARGET}/ssl" \
            --libdir=lib

          make -j "$(sysctl -n hw.ncpu)"

          sudo make install

          OPENSSL_BIN="${OPENSSL_TARGET}/bin/openssl"

          test -x "$OPENSSL_BIN"

          "$OPENSSL_BIN" version -a

          test -d "${OPENSSL_TARGET}/include/openssl"
          test -d "${OPENSSL_TARGET}/lib"

      # ==========================================
      # 5. Install Mozilla CA certificates
      # ==========================================
      - name: Install trusted CA certificates
        run: |
          set -euo pipefail

          CA_DIR="${OPENSSL_TARGET}/ssl"
          CA_FILE="${CA_DIR}/cert.pem"
          CA_TEMP="${RUNNER_TEMP}/cacert.pem"

          curl --fail --location \
            --retry 3 \
            --connect-timeout 30 \
            --proto '=https' \
            --tlsv1.2 \
            --output "$CA_TEMP" \
            "https://curl.se/ca/cacert.pem"

          test -s "$CA_TEMP"

          grep -q "BEGIN CERTIFICATE" "$CA_TEMP"

          # Validate the PEM certificate bundle
          "${OPENSSL_TARGET}/bin/openssl" crl2pkcs7 \
            -nocrl \
            -certfile "$CA_TEMP" \
            -outform PEM \
            -out /dev/null

          sudo mkdir -p "$CA_DIR"

          sudo install -m 644 \
            "$CA_TEMP" \
            "$CA_FILE"

          test -s "$CA_FILE"

          echo "Trusted CA bundle installed:"
          ls -lh "$CA_FILE"

          "${OPENSSL_TARGET}/bin/openssl" version -d

      # ==========================================
      # 6. Verify OpenSSL and CA bundle
      # ==========================================
      - name: Verify OpenSSL
        run: |
          set -euo pipefail

          OPENSSL_BIN="${OPENSSL_TARGET}/bin/openssl"
          CA_FILE="${OPENSSL_TARGET}/ssl/cert.pem"

          "$OPENSSL_BIN" version | \
            grep -F "OpenSSL ${OPENSSL_VERSION}"

          test -s "$CA_FILE"

          echo "Testing TLS certificate verification..."

          "$OPENSSL_BIN" s_client \
            -connect www.python.org:443 \
            -servername www.python.org \
            -CAfile "$CA_FILE" \
            -verify_return_error \
            -brief \
            </dev/null

          echo "OpenSSL TLS verification passed."

      # ==========================================
      # 7. Package OpenSSL
      # ==========================================
      - name: Create OpenSSL PKG
        run: |
          set -euo pipefail

          PKG_ID="org.enmoe.openssl.${OPENSSL_VERSION}"
          PKG_NAME="openssl-${OPENSSL_VERSION}-arm64.pkg"

          mkdir -p scripts_openssl

          cat > scripts_openssl/postinstall <<EOF
          #!/bin/sh
          set -eu

          mkdir -p /etc/paths.d

          echo "${OPENSSL_TARGET}/bin" > "/etc/paths.d/${PKG_ID}"

          chmod 644 "/etc/paths.d/${PKG_ID}"

          exit 0
          EOF

          chmod 755 scripts_openssl/postinstall

          sudo pkgbuild \
            --root "${OPENSSL_TARGET}" \
            --identifier "${PKG_ID}" \
            --version "${OPENSSL_VERSION}" \
            --install-location "${OPENSSL_TARGET}" \
            --ownership recommended \
            --scripts scripts_openssl \
            "${PKG_NAME}"

          test -s "${PKG_NAME}"

          ls -lh "${PKG_NAME}"

      # ==========================================
      # 8. Download Python
      # ==========================================
      - name: Download Python
        run: |
          set -euo pipefail

          URL="https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz"

          curl --fail --location \
            --retry 3 \
            --connect-timeout 30 \
            --output python.tgz \
            "$URL"

          tar -xzf python.tgz

          mv "Python-${PYTHON_VERSION}" python_src

          test -x python_src/configure

      # ==========================================
      # 9. Build Python
      # ==========================================
      - name: Build and install Python
        run: |
          set -euo pipefail

          cd python_src

          export CPPFLAGS="-I${OPENSSL_TARGET}/include"
          export LDFLAGS="-L${OPENSSL_TARGET}/lib"

          export PKG_CONFIG_PATH="${OPENSSL_TARGET}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"

          ./configure \
            --prefix="${PYTHON_TARGET}" \
            --with-openssl="${OPENSSL_TARGET}" \
            --with-openssl-rpath="${OPENSSL_TARGET}/lib" \
            --with-ensurepip=install

          make -j "$(sysctl -n hw.ncpu)"

          sudo make altinstall

          PYTHON_BIN="${PYTHON_TARGET}/bin/python${PYTHON_MINOR}"

          test -x "$PYTHON_BIN"

          cd "${PYTHON_TARGET}/bin"

          # Private commands, no system Python overwrite
          sudo ln -sfn "python${PYTHON_MINOR}" python3
          sudo ln -sfn "python${PYTHON_MINOR}" python

          if [ -x "pip${PYTHON_MINOR}" ]; then
            sudo ln -sfn "pip${PYTHON_MINOR}" pip3
            sudo ln -sfn "pip${PYTHON_MINOR}" pip
          fi

          "${PYTHON_TARGET}/bin/python3" --version

      # ==========================================
      # 10. Verify Python and SSL
      # ==========================================
      - name: Verify Python SSL integration
        run: |
          set -euo pipefail

          PYTHON_BIN="${PYTHON_TARGET}/bin/python3"

          "$PYTHON_BIN" - <<'PY'
          import os
          import sys
          import ssl
          import _ssl
          import platform
          import hashlib

          print("Python:", sys.version)
          print("Python executable:", sys.executable)
          print("OpenSSL:", ssl.OPENSSL_VERSION)
          print("Architecture:", platform.machine())

          assert platform.machine() == "arm64"

          assert platform.python_version() == \
              os.environ["PYTHON_VERSION"]

          assert ssl.OPENSSL_VERSION.startswith(
              "OpenSSL " + os.environ["OPENSSL_VERSION"]
          )

          assert sys.prefix == os.environ["PYTHON_TARGET"]

          expected_ca = os.path.join(
              os.environ["OPENSSL_TARGET"],
              "ssl",
              "cert.pem"
          )

          paths = ssl.get_default_verify_paths()

          print("Default CA:", paths.cafile)
          print("Expected CA:", expected_ca)

          assert paths.cafile == expected_ca
          assert os.path.isfile(expected_ca)

          context = ssl.create_default_context()

          count = len(context.get_ca_certs())

          print("Trusted CA count:", count)

          assert count > 0
          assert context.verify_mode == ssl.CERT_REQUIRED
          assert context.check_hostname

          print("SSL integration verified.")
          PY

          echo "Checking dynamic libraries..."

          SSL_MODULE="$("$PYTHON_BIN" -c 'import _ssl; print(_ssl.__file__)')"

          otool -L "$SSL_MODULE"

          otool -L "$SSL_MODULE" | \
            grep -F "${OPENSSL_TARGET}/lib/libssl"

          otool -L "$SSL_MODULE" | \
            grep -F "${OPENSSL_TARGET}/lib/libcrypto"

      # ==========================================
      # 11. Test real HTTPS connections
      # ==========================================
      - name: Test HTTPS certificates
        run: |
          set -euo pipefail

          "${PYTHON_TARGET}/bin/python3" - <<'PY'
          import ssl
          import urllib.request

          context = ssl.create_default_context()

          urls = [
              "https://www.python.org/",
              "https://pypi.org/simple/",
              "https://github.com/",
          ]

          for url in urls:
              print("Testing:", url, flush=True)

              with urllib.request.urlopen(
                  url,
                  context=context,
                  timeout=30
              ) as response:
                  print(
                      "HTTP status:",
                      response.status,
                      flush=True
                  )

                  assert 200 <= response.status < 400

          print("HTTPS certificate verification passed.")
          PY

      # ==========================================
      # 12. Verify pip
      # ==========================================
      - name: Test pip HTTPS
        run: |
          set -euo pipefail

          PYTHON_BIN="${PYTHON_TARGET}/bin/python3"

          "$PYTHON_BIN" -m pip --version

          # Download without installing into the global prefix
          mkdir -p "${RUNNER_TEMP}/pip-test"

          "$PYTHON_BIN" -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --index-url https://pypi.org/simple/ \
            --dest "${RUNNER_TEMP}/pip-test" \
            certifi

          echo "Downloaded packages:"
          ls -lh "${RUNNER_TEMP}/pip-test"

          echo "pip HTTPS verification passed."

      # ==========================================
      # 13. Package Python
      # ==========================================
      - name: Create Python PKG
        run: |
          set -euo pipefail

          PKG_ID="org.enmoe.python.${PYTHON_VERSION}"
          PKG_NAME="Python-${PYTHON_VERSION}-arm64.pkg"

          mkdir -p scripts_python

          cat > scripts_python/postinstall <<EOF
          #!/bin/sh
          set -eu

          mkdir -p /etc/paths.d

          echo "${PYTHON_TARGET}/bin" > "/etc/paths.d/${PKG_ID}"

          chmod 644 "/etc/paths.d/${PKG_ID}"

          exit 0
          EOF

          chmod 755 scripts_python/postinstall

          sudo pkgbuild \
            --root "${PYTHON_TARGET}" \
            --identifier "${PKG_ID}" \
            --version "${PYTHON_VERSION}" \
            --install-location "${PYTHON_TARGET}" \
            --ownership recommended \
            --scripts scripts_python \
            "${PKG_NAME}"

          test -s "${PKG_NAME}"

          ls -lh "${PKG_NAME}"

      # ==========================================
      # 14. Verify package integrity
      # ==========================================
      - name: Verify generated packages
        run: |
          set -euo pipefail

          OPENSSL_PKG="openssl-${OPENSSL_VERSION}-arm64.pkg"
          PYTHON_PKG="Python-${PYTHON_VERSION}-arm64.pkg"

          mkdir -p "${RUNNER_TEMP}/pkg-check"

          pkgutil --expand \
            "$OPENSSL_PKG" \
            "${RUNNER_TEMP}/pkg-check/openssl"

          pkgutil --expand \
            "$PYTHON_PKG" \
            "${RUNNER_TEMP}/pkg-check/python"

          test -f "${RUNNER_TEMP}/pkg-check/openssl/PackageInfo"
          test -f "${RUNNER_TEMP}/pkg-check/python/PackageInfo"

          echo "Package sizes:"
          ls -lh "$OPENSSL_PKG" "$PYTHON_PKG"

          echo "Package SHA256:"
          shasum -a 256 "$OPENSSL_PKG" "$PYTHON_PKG"

          echo "Package verification passed."

      # ==========================================
      # 15. Upload artifacts
      # ==========================================
      - name: Upload macOS ARM64 installers
        uses: actions/upload-artifact@v4
        with:
          name: macOS-ARM64-Python-${{ env.PYTHON_VERSION }}-OpenSSL-${{ env.OPENSSL_VERSION }}
          path: |
            openssl-${{ env.OPENSSL_VERSION }}-arm64.pkg
            Python-${{ env.PYTHON_VERSION }}-arm64.pkg
          if-no-files-found: error
          retention-days: 30
